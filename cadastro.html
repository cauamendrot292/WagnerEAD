<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Trilha EaD</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <div class="caixa caixa-estreita">
      <h1>Criar conta</h1>
      <form id="form-cadastro">
        <label>Nome completo <input id="nome" required></label>
        <label>E-mail <input type="email" id="email" required autocomplete="email"></label>
        <div class="linha">
          <label>Senha <input type="password" id="senha" required autocomplete="new-password"></label>
          <label>Confirmar senha <input type="password" id="senha2" required autocomplete="new-password"></label>
        </div>
        <div class="metodos">
          <label><input type="radio" name="papel" value="aluno" checked> Sou aluno</label>
          <label><input type="radio" name="papel" value="professor"> Sou professor</label>
        </div>
        <label id="campo-registro" hidden>Registro profissional <input id="registro" placeholder="Ex.: CREA, CRA, número da licença..."></label>
        <p id="erro" class="msg-erro"></p>
        <button class="btn" type="submit">Cadastrar</button>
      </form>
      <p class="meta" style="margin-top:18px">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
