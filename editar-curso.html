<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar curso - Trilha EaD</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <p><a href="professor.html">&larr; Meus cursos</a></p>
    <h1 id="titulo-curso">Editar curso</h1>
    <p>
      <a class="btn-sec btn-pequeno" id="ver-pagina" href="#">Ver página do curso</a>
      <a class="btn-sec btn-pequeno" id="ver-aulas" href="#">Ver aulas</a>
    </p>

    <div class="caixa">
      <h2>Dados do curso</h2>
      <form id="form-dados">
        <label>Nome <input id="nome" required></label>
        <label>Descrição <textarea id="descricao" rows="3"></textarea></label>
        <div class="linha">
          <label>Carga horária (horas) <input id="carga" type="number" min="1" required></label>
          <label>Preço (R$) <input id="preco" type="number" min="0" step="0.01"></label>
        </div>
        <label><input type="checkbox" id="publicado"> Curso publicado (aparece no catálogo)</label>
        <div style="display:flex;justify-content:space-between">
          <button class="btn" type="submit">Salvar dados</button>
          <button class="btn-perigo" type="button" id="excluir-curso">Excluir curso</button>
        </div>
      </form>
    </div>

    <div class="caixa">
      <h2>Módulos e aulas</h2>
      <p class="meta">Vídeos enviados ficam como "aguardando conversão" até o transcodificador gerar as versões em HLS (360p, 720p e 1080p).</p>
      <div id="modulos"><p class="vazio">Carregando...</p></div>
      <form id="form-modulo" class="novo-item">
        <h4>Novo módulo</h4>
        <div class="linha">
          <input id="nome-modulo" required placeholder="Nome do módulo">
          <button class="btn" type="submit" style="flex:0 0 auto">Adicionar módulo</button>
        </div>
      </form>
    </div>

    <div class="caixa">
      <h2>Alunos matriculados</h2>
      <div id="alunos"><p class="vazio">Carregando...</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/editar-curso.js"></script>
</body>
</html>
